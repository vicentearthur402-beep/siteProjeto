
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ligas</title>
    <link rel="stylesheet" href="ligas.css">
</head>

<body>
    <header>
        <h1>Ligas</h1>
        <button type="button" onclick="window.location.href='/home'">
    Voltar ao menu
</button>
        <button type="button" id="themeToggle">Modo claro</button>
    </header>

    <div id="cadastrarLigas">
        <form id="cadastroLigas">
            <p>Título da Liga</p>
            <input
                type="text"
                name="nome"
                id="nome"
                placeholder="Título"
                required
            >

            <p>Descrição da Liga</p>
            <input
                type="text"
                name="descricao"
                id="descricao"
                placeholder="Descrição"
                required
            >

            <button type="submit" id="enviar">Cadastrar</button>
        </form>
    </div>

    <div id="ligasCadastradas">
        <h2>Ligas cadastradas</h2>

        <table>
            <thead>
                <tr>
                    <th>Nome da liga</th>
                    <th>Times</th>
                    <th>Ações</th>
                </tr>
            </thead>

            <tbody id="listaLigas"></tbody>
        </table>
    </div>

    <script>
        const formulario = document.getElementById("cadastroLigas");
        const enviarBotao = document.getElementById("enviar");

        // CADASTRAR LIGA
        formulario.addEventListener("submit", async function (ev) {
            ev.preventDefault();

            const nome = formulario.nome.value.trim();
            const descricao = formulario.descricao.value.trim();

            const response = await fetch("/api/ligas", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    nome: nome,
                    descricao: descricao
                })
            });

            if (response.ok) {
                formulario.reset();
                carregarLigas();
            } else {
                const erro = await response.json();
                alert(erro.msg || "Erro ao cadastrar liga");
            }
        });

        // CARREGAR LIGAS
        async function carregarLigas() {
            try {
                const response = await fetch("/api/ligas");
                const ligas = await response.json();

                if (!response.ok) {
                    console.error("Erro ao carregar ligas:", ligas);
                    return;
                }

                if (!Array.isArray(ligas)) {
                    console.error("A API não retornou uma lista de ligas:", ligas);
                    return;
                }

                const lista = document.querySelector("#listaLigas");

                lista.innerHTML = "";

                ligas.forEach(liga => {
                    const linha = document.createElement("tr");

                    linha.innerHTML = `
                        <td>${liga.nome}</td>
                        <td>${liga.times || 0}</td>
                        <td>
                            <button class="editar">Editar</button>
                            <button class="excluir">Excluir</button>
                        </td>
                    `;

                    // EDITAR
                    const editar = linha.querySelector(".editar");

                    editar.addEventListener("click", function () {
                        window.location.href = `/liga?id=${liga.id}`;
                    });

                    // EXCLUIR
                    const excluir = linha.querySelector(".excluir");

                    excluir.addEventListener("click", async function () {
                        const confirmar = confirm(
                            `Deseja excluir a liga ${liga.nome} e todos os seus times?`
                        );

                        if (!confirmar) {
                            return;
                        }

                        const resposta = await fetch(`/api/ligas/${liga.id}`, {
                            method: "DELETE"
                        });

                        if (resposta.ok) {
                            alert("Liga excluída com sucesso!");
                            carregarLigas();
                        } else {
                            const erro = await resposta.json();
                            alert(erro.msg || "Erro ao excluir liga");
                        }
                    });

                    lista.appendChild(linha);
                });

            } catch (erro) {
                console.error("Erro ao buscar ligas:", erro);
            }
        }


        carregarLigas();

        const botao = document.querySelector("#themeToggle");

        botao.addEventListener("click", function () {
            document.body.classList.toggle("light");

            if (document.body.classList.contains("light")) {
                botao.textContent = "Modo escuro";
            } else {
                botao.textContent = "Modo claro";
            }
        });
    </script>
</body>

</html>
